<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ho so gia dinh</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #d8e0ea;
      --accent: #0f766e;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.1);
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(920px, 92vw);
      margin: 0 auto;
      padding: 36px 0;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    section {
      display: grid;
      gap: 12px;
      margin-top: 24px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.25;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
<main>
  <a href="index.html">Quay lai danh sach</a>
  <section>
    <h1>Ho so gia dinh</h1>
    <p>Trang nay dang san sang de bo sung thong tin ho so gia dinh.</p>
  </section>
</main>
</body>
</html>
