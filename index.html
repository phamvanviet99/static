<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sach muc</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #d8e0ea;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.1);
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(760px, 92vw);
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      margin-bottom: 24px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 30px;
      line-height: 1.25;
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.5;
    }

    .menu-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-link {
      display: grid;
      gap: 6px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel);
      box-shadow: var(--shadow);
      text-decoration: none;
    }

    .menu-link:hover {
      border-color: rgba(15, 118, 110, 0.45);
      background: #f0fdfa;
    }

    .menu-title {
      font-size: 17px;
      font-weight: 700;
    }

    .menu-description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Danh sach muc</h1>
    <p>Chon mot muc de mo trang can su dung.</p>
  </header>

  <ul class="menu-list">
    <li>
      <a class="menu-link" href="sua-chua-xe.html">
        <span class="menu-title">Sua chua xe</span>
        <span class="menu-description">Mo ban do sua xe, vi tri cua toi va chi duong den dia diem da chon.</span>
      </a>
    </li>
    <li>
      <a class="menu-link" href="ho-so-gia-dinh.html">
        <span class="menu-title">Ho so gia dinh</span>
        <span class="menu-description">Mo trang quan ly ho so gia dinh.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
