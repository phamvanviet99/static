<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #18212f;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(92vw, 560px);
      padding: 32px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(20, 31, 48, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 24px;
      color: #536173;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      background: #1463ff;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f4fd0;
    }

    #message {
      margin-top: 18px;
      font-weight: 700;
      color: #0b7a42;
    }
  </style>
</head>
<body>
  <main>
    <h1>Trang HTML test</h1>
    <p>File nay dung de kiem tra HTML, CSS va JavaScript co hoat dong binh thuong hay khong.</p>
    <button type="button" id="testButton">Bam de test</button>
    <div id="message" aria-live="polite"></div>
  </main>

  <script>
    const button = document.querySelector("#testButton");
    const message = document.querySelector("#message");

    button.addEventListener("click", () => {
      message.textContent = "JavaScript dang hoat dong.";
    });
  </script>
</body>
</html>
